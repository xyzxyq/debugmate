[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debugmate"
version = "0.1.0"
description = "面向 AI 专业学习场景的多模态报错诊断与复盘智能体"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov",
  "ruff==0.15.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "cloud: tests that require real cloud credentials or network access",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
