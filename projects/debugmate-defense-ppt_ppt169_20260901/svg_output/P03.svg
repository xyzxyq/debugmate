<g id="slide-content" data-pptx-bounds="56 60 1168 650">
<text x="56" y="105" font-family="Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#14212B">普通问答为什么不够</text>
<text x="58" y="137" font-family="Microsoft YaHei, Arial" font-size="17" fill="#708087">价值不在于“回答更多”，而在于让回答可追溯、可检查、可复盘</text>
<rect x="56" y="210" width="350" height="280" rx="18" fill="#FFFFFF" stroke="#C5D2CC" stroke-width="1.5" opacity="1"/>
<text x="82" y="270" font-family="Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#F0784A" opacity="0.35">01</text>
<text x="84" y="340" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#14212B">证据缺失</text>
<text x="84" y="382" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="400" fill="#33424D">看似合理的安装命令，未必绑定当前</text>
<text x="84" y="410" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="400" fill="#33424D">环境和官方资料。</text>
<rect x="84" y="450" width="80" height="5" rx="2" fill="#F0784A"/>
<rect x="444" y="210" width="350" height="280" rx="18" fill="#FFFFFF" stroke="#C5D2CC" stroke-width="1.5" opacity="1"/>
<text x="470" y="270" font-family="Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#0F9D8A" opacity="0.35">02</text>
<text x="472" y="340" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#14212B">环境不确定</text>
<text x="472" y="382" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="400" fill="#33424D">解释器、版本、路径和截图信息常常</text>
<text x="472" y="410" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="400" fill="#33424D">分散在不同位置。</text>
<rect x="472" y="450" width="80" height="5" rx="2" fill="#0F9D8A"/>
<rect x="832" y="210" width="350" height="280" rx="18" fill="#FFFFFF" stroke="#C5D2CC" stroke-width="1.5" opacity="1"/>
<text x="858" y="270" font-family="Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#6D7BB8" opacity="0.35">03</text>
<text x="860" y="340" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#14212B">结果难沉淀</text>
<text x="860" y="382" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="400" fill="#33424D">修好一次不等于理解一次，缺少结构</text>
<text x="860" y="410" font-family="Microsoft YaHei, Arial" font-size="17" font-weight="400" fill="#33424D">化的学习记录。</text>
<rect x="860" y="450" width="80" height="5" rx="2" fill="#6D7BB8"/>
<rect x="56" y="540" width="1168" height="70" rx="18" fill="#14212B" stroke="#14212B" stroke-width="1.5" opacity="1"/>
<text x="640" y="584" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="23" font-weight="700" fill="#FFFFFF">目标：把一次排错，转化为可追溯、可检查、可复盘的学习过程。</text>
