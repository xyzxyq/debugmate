        code: |
          import hashlib
          import json
          import re


          EXPECTED_KNOWLEDGE_BUILD_ID = "e8e065b4e33f3090687569c409e3695e304ba52b068cf0e08d1c93cb139c71ff"
          SOURCE_ID = re.compile(r"^[a-z0-9][a-z0-9._:-]{1,127}$")


          def bounded_text(value, limit):
              if not isinstance(value, str):
                  return ""
              return value.strip()[:limit]


          def as_dict(value):
              return value if isinstance(value, dict) else {}


          def locator_from_content(value):
              if not isinstance(value, str):
                  return ""
              for line in value.splitlines():
                  line = line.strip()
                  if not line.startswith("- #"):
                      continue
                  locator = line[2:].split("：", 1)[0].split(":", 1)[0].strip()
                  if locator.startswith("#"):
                      return locator
              return ""


          def retrieval_records(value):
              if isinstance(value, str):
                  try:
                      value = json.loads(value)
                  except (TypeError, ValueError):
                      return []
              if isinstance(value, list):
                  return value
              records = as_dict(value).get("records", [])
              return records if isinstance(records, list) else []


          def source_url_from_metadata(value):
              value = bounded_text(value, 2000)
              if value.startswith("[") and "](" in value and value.endswith(")"):
                  value = value.split("](", 1)[1][:-1].strip()
              return value


          def main(retrieval_result=None, case_id=""):
              raw_hits = retrieval_records(retrieval_result)
              hits = []
              seen = set()
              for item in raw_hits:
                  if not isinstance(item, dict):
                      continue
                  segment = as_dict(item.get("segment"))
                  document = as_dict(segment.get("document"))
                  item_metadata = as_dict(item.get("metadata"))
                  metadata = {
                      **item_metadata,
                      **as_dict(item_metadata.get("doc_metadata")),
                      **as_dict(segment.get("metadata")),
                      **as_dict(document.get("doc_metadata")),
                  }
                  raw_chunk_id = bounded_text(
                      item.get("id")
                      or item.get("segment_id")
                      or segment.get("id")
                      or segment.get("segment_id")
                      or metadata.get("segment_id")
                      or metadata.get("chunk_id"),
                      512,
                  )
                  source_id = bounded_text(metadata.get("source_id"), 128)
                  source_url = source_url_from_metadata(metadata.get("source_url"))
                  summary = bounded_text(
                      item.get("content") or segment.get("content"), 2000
                  )
                  locator = bounded_text(
                      metadata.get("locator") or locator_from_content(summary), 300
                  )
                  source_title = bounded_text(
                      item.get("title")
                      or segment.get("title")
                      or document.get("name")
                      or metadata.get("document_name")
                      or metadata.get("title"),
                      300,
                  )
                  build_id = bounded_text(metadata.get("knowledge_build_id"), 64)
                  if (
                      not raw_chunk_id
                      or not SOURCE_ID.fullmatch(source_id)
                      or not source_url.startswith("https://")
                      or not locator
                      or not summary
                      or not source_title
                      or build_id != EXPECTED_KNOWLEDGE_BUILD_ID
                  ):
                      continue
                  chunk_id_fingerprint = hashlib.sha256(
                      raw_chunk_id.encode("utf-8")
                  ).hexdigest()
                  if chunk_id_fingerprint in seen:
                      continue
                  seen.add(chunk_id_fingerprint)
                  score = item.get(
                      "score",
                      segment.get("score", metadata.get("score", "not_reported")),
                  )
                  if isinstance(score, bool) or not isinstance(score, (int, float)):
                      score = "not_reported"
                  else:
                      score = max(0.0, min(1.0, float(score)))
                  hits.append(
                      {
                          "chunk_fingerprint": chunk_id_fingerprint,
                          "source_id": source_id,
                          "source_title": source_title,
                          "source_url": source_url,
                          "locator": locator,
                          "content_summary": summary,
                          "relevance_score": score,
                      }
                  )
                  if len(hits) == 4:
                      break
              run_payload_fingerprint = hashlib.sha256(
                  json.dumps(
                      {"case_id": case_id, "hits": hits},
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest()
              retrieval_trace = {
                  "knowledge_build_id": EXPECTED_KNOWLEDGE_BUILD_ID,
                  "run_fingerprint": run_payload_fingerprint,
                  "node_fingerprint": hashlib.sha256(
                      b"debugmate-direct-retrieval-sanitizer-v1"
                  ).hexdigest(),
                  "hits": hits,
              }
              retrieved_chunks_json = json.dumps(
                  hits, ensure_ascii=False, separators=(",", ":")
              )
              return {
                  "retrieved_chunks": hits,
                  "retrieved_chunks_json": retrieved_chunks_json,
                  "retrieval_trace": retrieval_trace,
              }
