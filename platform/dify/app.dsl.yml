    - data:
        code: "import hashlib\nimport json\nimport re\n\n\nVALID_CATEGORIES = {\n\
          \    \"dependency_environment\",\n    \"path_permission\",\n    \"python_runtime\"\
          ,\n    \"tensor_shape_dtype\",\n    \"cuda_memory\",\n    \"model_loading\"\
          ,\n    \"unknown\",\n}\n\nVALID_SOURCE_KINDS = {\"text\", \"ocr\", \"vlm\"\
          , \"user\"}\n\nVALID_PLATFORMS = {\n    \"windows_powershell\",\n    \"\
          windows_cmd\",\n    \"linux_bash\",\n    \"python\",\n    \"platform_agnostic\"\
          ,\n}\n\n\ndef as_text(value, fallback=\"\"):\n    if isinstance(value, str):\n\
          \        value = value.strip()\n        return value or fallback\n    if\
          \ value is None:\n        return fallback\n    return json.dumps(value,\
          \ ensure_ascii=False, default=str)\n\n\ndef as_score(value):\n    try:\n\
          \        return max(0.0, min(1.0, float(value)))\n    except (TypeError,\
          \ ValueError):\n        return 0.0\n\n\ndef make_id(prefix, *parts):\n \
          \   raw = json.dumps(\n        parts,\n        ensure_ascii=False,\n   \
          \     sort_keys=True,\n        default=str,\n    )\n    digest = hashlib.sha256(raw.encode(\"\
          utf-8\")).hexdigest()[:32]\n    return f\"{prefix}_{digest}\"\n\n\ndef as_string_list(value):\n\
          \    if not isinstance(value, list):\n        return []\n\n    result =\
          \ []\n    for item in value:\n        item_text = as_text(item)\n      \
          \  if item_text:\n            result.append(item_text)\n    return result\n\
          \n\ndef is_safe_command(command):\n    lowered = command.lower()\n\n   \
          \ blocked = (\n        \"\\n\",\n        \"\\r\",\n        \"&&\",\n   \
          \     \"||\",\n        \";\",\n        \"$(\",\n        \"`\",\n       \
          \ \"invoke-expression\",\n        \"remove-item -recurse\",\n        \"\
          rm -rf\",\n        \"rmdir /s\",\n        \"diskpart\",\n        \"format-volume\"\
          ,\n    )\n\n    return bool(command) and not any(\n        token in lowered\
          \ for token in blocked\n    )\n\n\ndef normalize_commands(value):\n    if\
          \ not isinstance(value, list):\n        return []\n\n    result = []\n\n\
          \    for item in value:\n        if not isinstance(item, dict):\n      \
          \      continue\n\n        command = as_text(item.get(\"command\"))\n  \
          \      if not is_safe_command(command):\n            continue\n\n      \
          \  platform = as_text(item.get(\"platform\"))\n        if platform not in\
          \ VALID_PLATFORMS:\n            platform = \"platform_agnostic\"\n\n   \
          \     result.append(\n            {\n                \"command\": command,\n\
          \                \"platform\": platform,\n                \"impact\": as_text(\n\
          \                    item.get(\"impact\"),\n                    \"执行前需要用户确认影响。\"\
          ,\n                ),\n                \"expected_result\": as_text(\n \
          \                   item.get(\"expected_result\"),\n                   \
          \ \"根据命令输出判断结果。\",\n                ),\n                \"rollback\": as_text(\n\
          \                    item.get(\"rollback\"),\n                    \"未自动执行，无需自动回退。\"\
          ,\n                ),\n            }\n        )\n\n    return result\n\n\
          \ndef main(diagnosis, expected_case_id):\n    if isinstance(diagnosis, str):\n\
