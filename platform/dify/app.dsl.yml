          import re


          ENVELOPE_VERSION = "1.0.0"
          SCHEMA_VERSION = "1.1.0"
          PROMPT_VERSION = "diagnosis-v1"
          KNOWLEDGE_BUILD_ID = "e8e065b4e33f3090687569c409e3695e304ba52b068cf0e08d1c93cb139c71ff"
          DSL_SEMANTIC_SHA256 = "9a195fcd01c9525f15f52ee70794485c6dc09b980ac8fff6bde5314d03eb4357"
          FACT_ID = re.compile(r"^fact_[0-9a-f]{32}$")
          SOURCE_KINDS = {"text", "ocr", "vlm", "user"}


          def bounded_text(value, limit):
              if not isinstance(value, str):
                  return ""
              return value.strip()[:limit]


          def main(diagnosis=None, retrieval_trace=None, expected_case_id=""):
              diagnosis = dict(diagnosis) if isinstance(diagnosis, dict) else {}
              facts = []
              for item in diagnosis.get("observed_facts") or []:
                  if not isinstance(item, dict) or len(facts) == 64:
                      break
                  fact_id = bounded_text(item.get("fact_id"), 37)
                  source_kind = bounded_text(item.get("source_kind"), 16)
                  confidence = item.get("confidence")
                  if (
                      not FACT_ID.fullmatch(fact_id)
                      or source_kind not in SOURCE_KINDS
                      or isinstance(confidence, bool)
                      or not isinstance(confidence, (int, float))
                  ):
                      continue
                  facts.append(
                      {
                          "fact_id": fact_id,
                          "field_id": bounded_text(item.get("field_id"), 128),
                          "value": bounded_text(item.get("value"), 4000),
                          "source_kind": source_kind,
                          "confidence": max(0.0, min(1.0, float(confidence))),
                          "locator": bounded_text(item.get("locator"), 300),
                      }
                  )
              diagnosis["case_id"] = expected_case_id
              diagnosis["schema_version"] = SCHEMA_VERSION
              diagnosis["observed_facts"] = facts
              trace = retrieval_trace if isinstance(retrieval_trace, dict) else {}
              run_envelope = {
                  "envelope_version": ENVELOPE_VERSION,
                  "case_id": expected_case_id,
                  "diagnosis": diagnosis,
                  "extraction_facts": facts,
                  "retrieval_trace": trace,
                  "contract": {
                      "schema_version": SCHEMA_VERSION,
                      "prompt_version": PROMPT_VERSION,
                      "knowledge_build_id": KNOWLEDGE_BUILD_ID,
                      "dsl_semantic_sha256": DSL_SEMANTIC_SHA256,
                  },
              }
              return {"run_envelope": run_envelope}
